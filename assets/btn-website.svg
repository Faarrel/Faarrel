<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="sweepG1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip1"><rect x="0.5" y="0.5" width="39" height="39" rx="10"/></clipPath>
    <style>
      @keyframes rise1 { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .card1 { animation: rise1 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
      @keyframes sweep1 {
        0% { transform: translateX(-30px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(50px); opacity: 0; }
      }
      .sweep1 { animation: sweep1 4.5s ease-in-out 0.2s infinite; opacity: 0; }
      @keyframes pulse1 { 0%, 100% { opacity: 0.88; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
      .icon1 { transform-origin: 20px 20px; animation: pulse1 3.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .card1, .sweep1, .icon1 { animation: none !important; } }
    </style>
  </defs>
  <rect class="card1" x="0.5" y="0.5" width="39" height="39" rx="10" fill="#161618" stroke="#2A2A2E"/>
  <g clip-path="url(#clip1)"><rect class="sweep1" x="0" y="0" width="22" height="1.5" fill="url(#sweepG1)"/></g>
  <g class="icon1" transform="translate(10, 10)" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="8.5"/>
    <line x1="1.5" y1="10" x2="18.5" y2="10"/>
    <path d="M10 1.5 C6.8 5.5 6.8 14.5 10 18.5 C13.2 14.5 13.2 5.5 10 1.5 Z"/>
  </g>
</svg>
