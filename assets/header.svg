<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="100%" height="auto">
  <defs>
    <!-- Background Canvas: #161618 to #121212 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161618"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <!-- Subtle White Ambient Glow (exact Hero.tsx bg-white/[0.04]) -->
    <radialGradient id="soft-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Typography Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>

    <!-- Left & Right Smooth Edge Fade Masks for Marquee -->
    <linearGradient id="edge-fade-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121212" stop-opacity="1"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge-fade-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121212" stop-opacity="0"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="1"/>
    </linearGradient>

    <!-- Full-Width Marquee Clip Path -->
    <clipPath id="marquee-window">
      <rect x="25" y="166" width="800" height="34"/>
    </clipPath>

    <style>
      /* Soft Ambient Breathing Glow */
      @keyframes ambient-breathe {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.08); }
      }
      .glow-layer {
        transform-origin: 425px 95px;
        animation: ambient-breathe 6s ease-in-out infinite;
      }

      /* Seamless Continuous Marquee Loop */
      @keyframes marquee-scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-800px); }
      }
      .marquee-strip {
        animation: marquee-scroll 24s linear infinite;
        will-change: transform;
      }

      @media (prefers-reduced-motion: reduce) {
        .glow-layer, .marquee-strip {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Base Card Frame -->
  <rect width="848" height="208" x="1" y="1" rx="18" fill="url(#bg-grad)" stroke="#27272A" stroke-width="1"/>

  <!-- Soft Ambient Glow -->
  <ellipse cx="425" cy="95" rx="360" ry="85" fill="url(#soft-glow)" class="glow-layer"/>

  <!-- Intro Line from Hero.tsx -->
  <text x="425" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA" text-anchor="middle" letter-spacing="2">
    HEY THERE, I'M
  </text>

  <!-- Hero Typography: FAARREL -->
  <text x="425" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Montserrat, Inter, sans-serif" font-size="62" font-weight="900" fill="url(#text-grad)" text-anchor="middle" letter-spacing="4">
    FAARREL
  </text>

  <!-- Subtitle from Hero.tsx -->
  <text x="425" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#D4D4D8" text-anchor="middle" letter-spacing="0.3">
    Graphic Designer  ·  Character Animator  ·  Discord Server Architect  ·  Fullstack Developer
  </text>

  <!-- Divider Line -->
  <line x1="25" y1="165" x2="825" y2="165" stroke="#27272A" stroke-width="1"/>

  <!-- Bottom Infinite Marquee (Mathematically 800px Seamless Loop) -->
  <g clip-path="url(#marquee-window)">
    <g class="marquee-strip">
      <text x="0" y="188" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#E0E0E0" textLength="800" lengthAdjust="spacing">
        GRAPHIC DESIGN   ✦   CHARACTER ANIMATION   ✦   DISCORD ARCHITECTURE   ✦   FULLSTACK DEVELOPMENT   ✦   
      </text>
      <text x="800" y="188" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#E0E0E0" textLength="800" lengthAdjust="spacing">
        GRAPHIC DESIGN   ✦   CHARACTER ANIMATION   ✦   DISCORD ARCHITECTURE   ✦   FULLSTACK DEVELOPMENT   ✦   
      </text>
      <text x="1600" y="188" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#E0E0E0" textLength="800" lengthAdjust="spacing">
        GRAPHIC DESIGN   ✦   CHARACTER ANIMATION   ✦   DISCORD ARCHITECTURE   ✦   FULLSTACK DEVELOPMENT   ✦   
      </text>
    </g>
  </g>

  <!-- Edge Fade Overlays -->
  <rect x="25" y="166" width="60" height="34" fill="url(#edge-fade-left)" pointer-events="none"/>
  <rect x="765" y="166" width="60" height="34" fill="url(#edge-fade-right)" pointer-events="none"/>
</svg>
