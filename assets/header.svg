<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Faarrel. Graphic Designer, Character Animator, Discord Server Architect and Fullstack Developer.">
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .in { animation: rise .8s cubic-bezier(.2,.7,.2,1) backwards; }

    @keyframes slide { to { transform: translateX(-1020.6px); } }
    .marq { animation: slide 36s linear infinite; }
    @keyframes sweep {
      0%   { transform: translateX(0);     opacity: 0; }
      12%  { opacity: 1; }
      70%  { opacity: 1; }
      85%  { transform: translateX(928px); opacity: 0; }
      100% { transform: translateX(928px); opacity: 0; }
    }
    .sweep { animation: sweep 7s ease-in-out 1.2s infinite; opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      .in, .card, .marq, .sweep, .scan { animation: none !important; }
      .f { display: none; }
    }

  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121212" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#121212" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#121212" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121212" stop-opacity="1"/>
      <stop offset="0.06" stop-color="#121212" stop-opacity="0"/>
      <stop offset="0.94" stop-color="#121212" stop-opacity="0"/>
      <stop offset="1" stop-color="#121212" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="tick"><rect x="56" y="254" width="1088" height="32"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="#121212" stroke="#2A2A2E"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="url(#fade)"/>

  <text class="in" style="animation-delay:.05s" x="56" y="64" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#8E8E93">faarrel.my.id</text>

  <g class="in" style="animation-delay:.2s">
    <rect x="866" y="40" width="278" height="36" rx="18" fill="#161618" stroke="#2A2A2E"/>
    <circle cx="890" cy="58" r="4" fill="#4ADE80"/>
    <circle cx="890" cy="58" r="4" fill="none" stroke="#4ADE80" stroke-width="1.5">
      <animate attributeName="r" values="4;12" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="906" y="63" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E8E93">open for global commissions</text>
  </g>

  <text class="in" style="animation-delay:.15s" x="52" y="168" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-4" fill="#F2F2F2">FAARREL</text>
  <text class="in" style="animation-delay:.4s" x="56" y="212" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#8E8E93">Graphic Designer, Character Animator, Discord Server Architect &amp; Fullstack Developer.</text>

  <line x1="56" y1="246" x2="1144" y2="246" stroke="#2A2A2E"/>
  <rect class="sweep" x="56" y="245.25" width="160" height="1.5" fill="url(#sweepG)"/>

