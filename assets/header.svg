<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="auto">
  <defs>
    <!-- Background Canvas Gradient from Portfolio: #161618 to #121212 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161618"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <!-- Pure Monochrome Soft Lighting Glow (exact matching Hero.tsx: bg-white/[0.04]) -->
    <radialGradient id="mono-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- High-Contrast Monochrome Typography Gradient (#FFFFFF to #D4D4D8) -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>

    <!-- Left & Right Edge Fades for Seamless Marquee -->
    <linearGradient id="fade-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121212" stop-opacity="1"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121212" stop-opacity="0"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="1"/>
    </linearGradient>

    <!-- Marquee Clip Path -->
    <clipPath id="marquee-clip">
      <rect x="80" y="185" width="690" height="30" rx="4"/>
    </clipPath>

    <style>
      /* Monochrome Ambient Breathing Glow */
      @keyframes breathe-glow {
        0%, 100% {
          opacity: 0.12;
          transform: scale(1);
        }
        50% {
          opacity: 0.28;
          transform: scale(1.1);
        }
      }
      .glow-layer {
        transform-origin: 425px 110px;
        animation: breathe-glow 5s ease-in-out infinite;
      }

      /* Monochrome Beacon Ripple */
      @keyframes beacon-ripple {
        0% {
          r: 3.5px;
          opacity: 0.8;
        }
        100% {
          r: 12px;
          opacity: 0;
        }
      }
      @keyframes beacon-dot {
        0%, 100% { fill: #FFFFFF; }
        50% { fill: #A1A1AA; }
      }
      .beacon-wave {
        animation: beacon-ripple 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
      }
      .beacon-core {
        animation: beacon-dot 2.2s ease-in-out infinite;
      }

      /* Infinite Seamless Marquee Animation */
      @keyframes marquee-scroll {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-560px);
        }
      }
      .marquee-track {
        animation: marquee-scroll 20s linear infinite;
        will-change: transform;
      }

      /* Reduced Motion Safety */
      @media (prefers-reduced-motion: reduce) {
        .glow-layer, .beacon-wave, .beacon-core, .marquee-track {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Card Surface with 1px border (#27272A) -->
  <rect width="848" height="238" x="1" y="1" rx="20" fill="url(#bg-grad)" stroke="#27272A" stroke-width="1"/>

  <!-- Animated Pure White Ambient Glow -->
  <ellipse cx="425" cy="110" rx="380" ry="90" fill="url(#mono-glow)" class="glow-layer"/>

  <!-- Top Status Badge: Available for Commissions (Monochrome) -->
  <g transform="translate(425, 42)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#1F1F23" stroke="#27272A" stroke-width="1"/>
    <!-- Monochrome Beacon Dot -->
    <circle cx="-118" cy="0" r="3.5" fill="#FFFFFF" class="beacon-core"/>
    <circle cx="-118" cy="0" r="3.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" class="beacon-wave"/>
    <text x="-104" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="9.5" font-weight="600" fill="#A1A1AA" letter-spacing="1.2">
      AVAILABLE FOR COMMISSIONS
    </text>
  </g>

  <!-- Wordmark: FAARREL (Monochrome Hero Typography) -->
  <text x="425" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Montserrat, Inter, sans-serif" font-size="62" font-weight="900" fill="url(#title-grad)" text-anchor="middle" letter-spacing="4">
    FAARREL
  </text>

  <!-- Role Description (#A1A1AA / zinc-400) -->
  <text x="425" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="500" fill="#A1A1AA" text-anchor="middle" letter-spacing="0.5">
    Creative Technologist &amp; Character Rigger
  </text>

  <!-- Divider Line (#27272A) -->
  <line x1="80" y1="176" x2="770" y2="176" stroke="#27272A" stroke-width="1"/>

  <!-- Bottom Animated Marquee Ticker Bar (Monochrome White & Zinc) -->
  <g clip-path="url(#marquee-clip)">
    <g class="marquee-track">
      <text x="80" y="204" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#F4F4F5" letter-spacing="1.8">
        GRAPHIC DESIGN  ·  CHARACTER ANIMATION  ·  DISCORD SYSTEMS  ·  WEB ENG  ✦  
      </text>
      <text x="640" y="204" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#F4F4F5" letter-spacing="1.8">
        GRAPHIC DESIGN  ·  CHARACTER ANIMATION  ·  DISCORD SYSTEMS  ·  WEB ENG  ✦  
      </text>
      <text x="1200" y="204" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#F4F4F5" letter-spacing="1.8">
        GRAPHIC DESIGN  ·  CHARACTER ANIMATION  ·  DISCORD SYSTEMS  ·  WEB ENG  ✦  
      </text>
    </g>
  </g>

  <!-- Left & Right Fade Masks for Edge Softening -->
  <rect x="70" y="185" width="45" height="30" fill="url(#fade-left)" pointer-events="none"/>
  <rect x="735" y="185" width="45" height="30" fill="url(#fade-right)" pointer-events="none"/>
</svg>
