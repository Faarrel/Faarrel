<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="sweepG5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip5"><rect x="0.5" y="0.5" width="39" height="39" rx="10"/></clipPath>
    <style>
      @keyframes rise5 { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .card5 { animation: rise5 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s backwards; }
      @keyframes sweep5 {
        0% { transform: translateX(-30px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(50px); opacity: 0; }
      }
      .sweep5 { animation: sweep5 4.5s ease-in-out 3.8s infinite; opacity: 0; }
      @keyframes pulse5 { 0%, 100% { opacity: 0.88; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
      .icon5 { transform-origin: 20px 20px; animation: pulse5 3.6s ease-in-out 1.2s infinite; }
      @media (prefers-reduced-motion: reduce) { .card5, .sweep5, .icon5 { animation: none !important; } }
    </style>
  </defs>
  <rect class="card5" x="0.5" y="0.5" width="39" height="39" rx="10" fill="#161618" stroke="#2A2A2E"/>
  <g clip-path="url(#clip5)"><rect class="sweep5" x="0" y="0" width="22" height="1.5" fill="url(#sweepG5)"/></g>
  <g class="icon5" transform="translate(10, 11)" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="1" width="18" height="15" rx="3"/>
    <path d="M1 2.5 L10 9.5 L19 2.5"/>
  </g>
</svg>
