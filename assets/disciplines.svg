<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Four disciplines: graphic design, character animation, Discord server architecture, and fullstack development.">
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .in { animation: rise .8s cubic-bezier(.2,.7,.2,1) backwards; }

    .card { animation: rise .8s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes scan {
      0%   { transform: translateX(0); opacity: 0; }
      10%  { opacity: 1; }
      40%  { opacity: 1; }
      50%  { transform: translateX(163px); opacity: 0; }
      100% { transform: translateX(163px); opacity: 0; }
    }
    .scan { animation: scan 6s ease-in-out infinite; opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      .in, .card, .marq, .sweep, .scan { animation: none !important; }
      .f { display: none; }
    }

  </style>
  <defs>
    <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(0.0 0)"><g class="card" style="animation-delay:0.05s"><rect x="0.5" y="0.5" width="284.0" height="329" rx="16" fill="#161618" stroke="#2A2A2E"/><text x="28" y="46" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B6B70">01</text><path d="M249 37 Q249 42 254 42 Q249 42 249 47 Q249 42 244 42 Q249 42 249 37Z" fill="#6B6B70"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" begin="0.0s" repeatCount="indefinite"/></path><text x="28" y="92" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">Graphic Design</text><text x="28" y="120" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">&amp; Visual Identity</text><text x="28" y="168" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">Animated PFPs, banners and</text><text x="28" y="190" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">brand visuals for creators</text><text x="28" y="212" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">and communities.</text><line x1="28" y1="262" x2="257.0" y2="262" stroke="#2A2A2E"/><text x="28" y="292" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E8E93">Photoshop &#183; Alight Motion</text><rect class="scan" style="animation-delay:1.4s" x="16" y="0" width="90" height="1.5" fill="url(#sweepG)"/></g></g><g transform="translate(305.0 0)"><g class="card" style="animation-delay:0.17s"><rect x="0.5" y="0.5" width="284.0" height="329" rx="16" fill="#161618" stroke="#2A2A2E"/><text x="28" y="46" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B6B70">02</text><path d="M249 37 Q249 42 254 42 Q249 42 249 47 Q249 42 244 42 Q249 42 249 37Z" fill="#6B6B70"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></path><text x="28" y="92" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">Character Animation</text><text x="28" y="120" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">&amp; Puppet Motion</text><text x="28" y="168" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">Layered PSDs rigged into</text><text x="28" y="190" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">2D puppets. Mesh deformation</text><text x="28" y="212" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">and 60 FPS loop cycles.</text><line x1="28" y1="262" x2="257.0" y2="262" stroke="#2A2A2E"/><text x="28" y="292" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E8E93">After Effects</text><rect class="scan" style="animation-delay:2.7s" x="16" y="0" width="90" height="1.5" fill="url(#sweepG)"/></g></g><g transform="translate(610.0 0)"><g class="card" style="animation-delay:0.29s"><rect x="0.5" y="0.5" width="284.0" height="329" rx="16" fill="#161618" stroke="#2A2A2E"/><text x="28" y="46" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B6B70">03</text><path d="M249 37 Q249 42 254 42 Q249 42 249 47 Q249 42 244 42 Q249 42 249 37Z" fill="#6B6B70"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" begin="1.6s" repeatCount="indefinite"/></path><text x="28" y="92" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">Discord Server</text><text x="28" y="120" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">Architecture</text><text x="28" y="168" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">Turnkey server layouts, roles</text><text x="28" y="190" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">and verification. Built for</text><text x="28" y="212" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">communities of 45,000.</text><line x1="28" y1="262" x2="257.0" y2="262" stroke="#2A2A2E"/><text x="28" y="292" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E8E93">Discord API &#183; discord.js</text><rect class="scan" style="animation-delay:4.0s" x="16" y="0" width="90" height="1.5" fill="url(#sweepG)"/></g></g><g transform="translate(915.0 0)"><g class="card" style="animation-delay:0.41s"><rect x="0.5" y="0.5" width="284.0" height="329" rx="16" fill="#161618" stroke="#2A2A2E"/><text x="28" y="46" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B6B70">04</text><path d="M249 37 Q249 42 254 42 Q249 42 249 47 Q249 42 244 42 Q249 42 249 37Z" fill="#6B6B70"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" begin="2.4000000000000004s" repeatCount="indefinite"/></path><text x="28" y="92" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">Fullstack Web</text><text x="28" y="120" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">&amp; Bot Development</text><text x="28" y="168" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">Next.js web apps and Discord</text><text x="28" y="190" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">bots in TypeScript, discord.js</text><text x="28" y="212" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">and Python.</text><line x1="28" y1="262" x2="257.0" y2="262" stroke="#2A2A2E"/><text x="28" y="292" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E8E93">Next.js 16 &#183; TypeScript</text><rect class="scan" style="animation-delay:5.3s" x="16" y="0" width="90" height="1.5" fill="url(#sweepG)"/></g></g>
</svg>