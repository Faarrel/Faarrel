<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Four disciplines: graphic design, character animation, Discord server architecture, and fullstack development.">
  <rect x="0.5" y="0.5" width="284.0" height="329" rx="16" fill="#161618" stroke="#2A2A2E"/><text x="28.0" y="46" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B6B70">01</text><path d="M249 37 Q249 42 254 42 Q249 42 249 47 Q249 42 244 42 Q249 42 249 37Z" fill="#6B6B70"/><text x="28.0" y="92" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">Graphic Design</text><text x="28.0" y="120" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">&amp; Visual Identity</text><text x="28.0" y="168" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">Animated PFPs, banners and</text><text x="28.0" y="190" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">brand visuals for creators</text><text x="28.0" y="212" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">and communities.</text><line x1="28.0" y1="262" x2="257.0" y2="262" stroke="#2A2A2E"/><text x="28.0" y="292" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E8E93">Photoshop &#183; Alight Motion</text><rect x="305.5" y="0.5" width="284.0" height="329" rx="16" fill="#161618" stroke="#2A2A2E"/><text x="333.0" y="46" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B6B70">02</text><path d="M554 37 Q554 42 559 42 Q554 42 554 47 Q554 42 549 42 Q554 42 554 37Z" fill="#6B6B70"/><text x="333.0" y="92" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">Character Animation</text><text x="333.0" y="120" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">&amp; Puppet Motion</text><text x="333.0" y="168" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">Layered PSDs rigged into</text><text x="333.0" y="190" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">2D puppets. Mesh deformation</text><text x="333.0" y="212" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">and 60 FPS loop cycles.</text><line x1="333.0" y1="262" x2="562.0" y2="262" stroke="#2A2A2E"/><text x="333.0" y="292" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E8E93">After Effects</text><rect x="610.5" y="0.5" width="284.0" height="329" rx="16" fill="#161618" stroke="#2A2A2E"/><text x="638.0" y="46" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B6B70">03</text><path d="M859 37 Q859 42 864 42 Q859 42 859 47 Q859 42 854 42 Q859 42 859 37Z" fill="#6B6B70"/><text x="638.0" y="92" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">Discord Server</text><text x="638.0" y="120" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">Architecture</text><text x="638.0" y="168" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">Turnkey server layouts, roles</text><text x="638.0" y="190" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">and verification. Built for</text><text x="638.0" y="212" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">communities of 45,000.</text><line x1="638.0" y1="262" x2="867.0" y2="262" stroke="#2A2A2E"/><text x="638.0" y="292" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E8E93">Discord API &#183; discord.js</text><rect x="915.5" y="0.5" width="284.0" height="329" rx="16" fill="#161618" stroke="#2A2A2E"/><text x="943.0" y="46" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6B6B70">04</text><path d="M1164 37 Q1164 42 1169 42 Q1164 42 1164 47 Q1164 42 1159 42 Q1164 42 1164 37Z" fill="#6B6B70"/><text x="943.0" y="92" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">Fullstack Web</text><text x="943.0" y="120" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F2F2">&amp; Bot Development</text><text x="943.0" y="168" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">Next.js web apps and Discord</text><text x="943.0" y="190" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">bots in TypeScript, discord.js</text><text x="943.0" y="212" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">and Python.</text><line x1="943.0" y1="262" x2="1172.0" y2="262" stroke="#2A2A2E"/><text x="943.0" y="292" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#8E8E93">Next.js 16 &#183; TypeScript</text>
