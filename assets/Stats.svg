<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="128" viewBox="0 0 1200 128" role="img" aria-label="300 plus delivered orders, 5.0 Fiverr rating from 136 reviews, 60 FPS loop cycles, 45,000 Discord members managed.">
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .in { animation: rise .8s cubic-bezier(.2,.7,.2,1) backwards; }

    @keyframes blip { 0% { opacity: 0; } 1% { opacity: 1; } 99% { opacity: 1; } 100% { opacity: 0; } }
    .f { opacity: 0; animation: blip 0.07s linear both; }
    @keyframes fin { from { opacity: 0; } to { opacity: 1; } }
    .fin { animation: fin .01s linear backwards; }
    @keyframes shimmer {
      0%   { transform: translateX(0);     opacity: 0; }
      10%  { opacity: 1; }
      45%  { opacity: 1; }
      55%  { transform: translateX(960px); opacity: 0; }
      100% { transform: translateX(960px); opacity: 0; }
    }
    .sweep { animation: shimmer 8s ease-in-out 2.5s infinite; opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      .in, .card, .marq, .sweep, .scan { animation: none !important; }
      .f { display: none; }
    }

  </style>
  <defs>
    <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
